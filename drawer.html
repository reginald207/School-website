<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Header</title>
    <link rel="stylesheet" href="drawer.css">
    <script defer src="drawer.js"></script>
</head>
<body>
    <!-- Header Section -->
    <header class="header">
        <div class="logo-container">
            <img src="logo.png" alt="Logo" class="logo">
            <span class="site-name">Oda Senior High School</span>
        </div>

        <!-- Menu Toggle Button -->
        <button id="menu-toggle" class="menu-toggle">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </button>

        <!-- Navigation Links -->
        <nav class="nav">
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#contact">Contact</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Mobile Menu Drawer -->
    <div id="mobile-menu" class="mobile-menu">
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#contact">Contact</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </div>



    <section class="hero">
        <div class="welcome-box">
            <h1>WELCOME</h1>
            <p>Welcome visitors to your site with a short, engaging introduction.</p>
            <button class="start-btn">Start Now</button>
        </div>
    </section>


    
  


</body>
</html>
