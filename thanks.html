<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Sent - Oda Senior High School</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #006400, #00a86b);
      overflow: hidden;
      padding: 20px;
    }

    .thank-you-container {
      text-align: center;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 25px 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 380px;
      color: #fff;
      animation: fadeIn 1s ease-in-out;
    }

    .thank-you-container img {
      width: 60px;
      margin-bottom: 10px;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3));
    }

    dotlottie-wc {
      display: block;
      margin: 0 auto 10px auto;
      max-width: 180px;
      height: auto;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    p {
      font-size: 0.95rem;
      color: #f0f0f0;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    button {
      background: #fff;
      color: #006400;
      padding: 10px 20px;
      border: none;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    button:hover {
      background: #f0f0f0;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    }

    .redirect-note {
      font-size: 0.8rem;
      color: #e0e0e0;
      margin-top: 12px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Responsive tweaks */
    @media (max-width: 480px) {
      .thank-you-container {
        padding: 20px 15px;
        max-width: 90%;
      }

      h1 {
        font-size: 1.4rem;
      }

      p {
        font-size: 0.9rem;
      }

      button {
        font-size: 0.9rem;
        padding: 8px 18px;
      }
    }
  </style>

  <!-- dotlottie player -->
  <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.6.2/dist/dotlottie-wc.js" type="module"></script>
</head>
<body>
  <div class="thank-you-container">
    <!-- School logo -->
    <img src="logo.png" alt="Oda Senior HighSchool Logo">

    <!-- Lottie animation -->
    <dotlottie-wc 
      src="https://lottie.host/d4aec368-02ff-49d0-956e-e867ba28785b/e3dYuSFvOX.lottie" 
      style="width: 180px; height: 180px;" 
      speed="1" autoplay loop>
    </dotlottie-wc>

    <h1>Thank You!</h1>
    <p>Your message has been sent successfully.<br>We’ll get back to you soon.</p>
    
    <button onclick="window.location.href='https://odashs.vercel.app/contact-osco'">Go Back</button>
    <p class="redirect-note">Redirecting in 5 seconds...</p>
  </div>

  <script>
    setTimeout(() => {
      window.location.href = "https://odashs.vercel.app/contact-osco";
    }, 5000);
  </script>
</body>
</html>
