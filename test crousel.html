<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Carousel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }

        .carousel {
            position: relative;
            width: 100%;
            height: 80vh;
            overflow: hidden;
            background-color: #2a2a8b;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h2{
            padding-bottom: 110px;
            font-size: 2em;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.5s ease;
            width: 100%;
        }

        .carousel-item {
            min-width: 100%;
            box-sizing: border-box;
        }

        .carousel-item img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            margin: 0 auto;
            display: block;
        }

        .carousel-item h3 {
            margin: 10px 0 5px;
            font-size: 1.5em;
        }

        .carousel-item p {
            font-size: 1em;
            margin: 0;
        }

        .carousel-arrows {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .carousel-arrow {
            background: none;
            border: none;
            color: white;
            font-size: 2em;
            cursor: pointer;
        }

        .carousel-pagination {
            margin-top: 20px;
        }

        .carousel-dot {
            height: 12px;
            width: 12px;
            background-color: white;
            border-radius: 50%;
            display: inline-block;
            margin: 0 5px;
            cursor: pointer;
        }

        .carousel-dot.active {
            background-color: #f5b800;
        }
    </style>
</head>
<body>

<div class="carousel">
    <h2>Notable Alumini</h2>
    <div class="carousel-track">
        <div class="carousel-item">
            <img src="bg.jpg" alt="Alumni 1">
            <h3>John Doe</h3>
            <p>Software Engineer at TechCorp</p>
        </div>
        <div class="carousel-item">
            <img src="bg.jpg" alt="Alumni 2">
            <h3>Jane Smith</h3>
            <p>Marketing Specialist at GlobalMedia</p>
        </div>
        <div class="carousel-item">
            <img src="bg.jpg" alt="Alumni 3">
            <h3>Samuel Green</h3>
            <p>Research Scientist at BioLab</p>
        </div>
    </div>

    <div class="carousel-arrows">
        <button class="carousel-arrow left">&#10094;</button>
        <button class="carousel-arrow right">&#10095;</button>
    </div>

    <div class="carousel-pagination">
        <span class="carousel-dot active"></span>
        <span class="carousel-dot"></span>
        <span class="carousel-dot"></span>
    </div>
</div>

<script>
 const track = document.querySelector('.carousel-track');
    const items = Array.from(track.children);
    const dots = Array.from(document.querySelectorAll('.carousel-dot'));
    const leftArrow = document.querySelector('.carousel-arrow.left');
    const rightArrow = document.querySelector('.carousel-arrow.right');

    let currentIndex = 0;

    function updateCarousel() {
        track.style.transform = `translateX(-${currentIndex * 100}%)`;
        dots.forEach((dot, index) => {
            dot.classList.toggle('active', index === currentIndex);
        });
    }

    function moveToNextSlide() {
        currentIndex = (currentIndex + 1) % items.length;
        updateCarousel();
    }

    // Auto-slide functionality
    let autoSlide = setInterval(moveToNextSlide, 5000); // Change slide every 5 seconds

    rightArrow.addEventListener('click', () => {
        clearInterval(autoSlide);
        currentIndex = (currentIndex + 1) % items.length;
        updateCarousel();
        autoSlide = setInterval(moveToNextSlide, 5000);
    });

    leftArrow.addEventListener('click', () => {
        clearInterval(autoSlide);
        currentIndex = (currentIndex - 1 + items.length) % items.length;
        updateCarousel();
        autoSlide = setInterval(moveToNextSlide, 5000);
    });

    dots.forEach((dot, index) => {
        dot.addEventListener('click', () => {
            clearInterval(autoSlide);
            currentIndex = index;
            updateCarousel();
            autoSlide = setInterval(moveToNextSlide, 5000);
        });
    });
</script>

</body>
</html>
