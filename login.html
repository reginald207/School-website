<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Oda Senior High School</title>
    <link rel="stylesheet" href="login.css">
    <!-- Firebase SDK for authentication -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <!-- Font Awesome for Exit icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    
</head>
<body>
    <div class="main-login-wrapper">
        <!-- Left Section: Image and Text for Larger Screens -->
        <div class="login-left-section">
            <img src="sch3.jpg" alt="Login Visual" class="login-left-image">
            <h1 class="login-page-title">Admin Login</h1>
        </div>

        <!-- Right Section: Login Form and Exit Button -->
        <div class="login-right-section">
            <button class="exit-button" id="exit-login-button" title="Back to Blog Page">
                <i class="fas fa-times"></i> <!-- X icon for exit -->
            </button>
            <div class="login-card">
                <h2 class="login-title">Welcome Back</h2>
                <p class="login-subtitle">Sign in to the Admin account</p>
                <form id="login-form">
                    <div class="input-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="login-button">SIGN IN</button>
                    <div id="error-message" class="error-message"></div>
                </form>
                <div class="forgot-password">
                    <a href="#"> </a>
                </div>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
